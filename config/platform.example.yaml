# Copy this file outside version control and adapt it when the competition API
# contract is available. Credentials are read from the named environment
# variable; never put token values in this file.
base_url: "https://ctf.example.invalid"
token_env: "MIDNIGHT_PLATFORM_TOKEN"
auth_header: "Authorization"
auth_scheme: "Bearer"
timeout_seconds: 15
allow_external_downloads: false
max_attachment_bytes: 268435456

endpoints:
  health: "/api/health"
  challenges: "/api/challenges"
  challenge: "/api/challenges/{challenge_id}"
  submit: "/api/challenges/{challenge_id}/submit"

# Dotted JSON paths allow the platform payload to be normalized without changing
# Python code. For example, use "task.title" for a nested field.
fields:
  id: "id"
  name: "name"
  description: "description"
  category: "category"
  remote: "remote"
  flag_format: "flag_format"
  round_id: "round_id"
  attachments: "attachments"
  attachment_name: "name"
  attachment_url: "url"

# Set these to "data.tasks", "data", etc. when responses use an envelope.
responses:
  challenge_list: "challenges"
  challenge_detail: ""
  submission: ""
  accepted: "accepted"
  message: "message"
  points: "points"

# JSON field sent to the submission endpoint.
submit_field: "flag"
