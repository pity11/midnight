# 专家 -> 工具清单映射（扩展入口）
# 工具名对应 tools/registry.py 中 @register_tool 注册的名字。
# 加工具：写一个插件文件注册 + 在此把名字加进对应专家清单（无需改图结构）。

# 所有专家共享的通用工具
common: &common
  - run_shell
  - read_file
  - write_file
  - list_dir
  - summarize_output
  - run_exploit        # target-bound solve.py execution with provenance capture
  - lookup_playbook     # evidence-triggered procedural knowledge; no challenge answers
  - record_evidence     # append-only structured observations/hypotheses/artifacts
  - read_evidence       # durable context across retries and future solver lanes
  - submit_flag        # 专家认为拿到 flag 时上报候选
  - ask_expert         # 跨专家求助（同容器内联返回）

