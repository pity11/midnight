# Runtime contracts for category-specific, offline-capable solver sandboxes.
# Required entries fail container startup. Optional commands document supported
# fallbacks that may be absent from the lightweight image.

pwn:
  required_commands:
    - bash
    - file
    - readelf
    - objdump
    - gdb
    - checksec
    - ROPgadget
    - ropper
    - pwninit
    - one_gadget
    - seccomp-tools
    - qemu-x86_64
    - python3
  required_python_modules: [pwn, capstone, angr, unicorn]
  optional_commands: [r2]

reverse:
  required_commands:
    - bash
    - file
    - strings
    - readelf
    - objdump
    - gdb
    - r2
    - upx
    - pyinstxtractor-ng
    - jadx
    - apktool
    - python3
  required_python_modules: [capstone, elftools, angr, unicorn]
  optional_commands: [analyzeHeadless]

web:
  required_commands: [bash, curl, wget, nc, nmap, sqlmap, nikto, whatweb, ffuf, fenjing, python3]
  required_python_modules: [requests, httpx, bs4]
  optional_commands: []

crypto:
  required_commands: [bash, openssl, xortool, python3]
  required_python_modules: [Crypto, sympy, gmpy2, z3, fpylll]
  optional_commands: [sage, RsaCtfTool]

misc:
  required_commands:
    - bash
    - file
    - xxd
    - binwalk
    - foremost
    - exiftool
    - steghide
    - zsteg
    - convert
    - tesseract
    - ffmpeg
    - sox
    - pickora
    - python3
  required_python_modules: [PIL, src.compiler]
  optional_commands: [stegseek]

forensics:
  required_commands:
    - bash
    - file
    - xxd
    - binwalk
    - foremost
    - exiftool
    - steghide
    - zsteg
    - vol
    - mmls
    - fls
    - icat
    - testdisk
    - tshark
    - capinfos
    - tesseract
    - python3
  required_python_modules: [PIL, volatility3]
  optional_commands: []

unknown:
  required_commands: [bash, file, xxd, python3]
  required_python_modules: []
  optional_commands: []
