[project]
name = "midnight"
version = "0.1.0"
description = "Reliable autonomous CTF solver for authorized competitions and benchmarks"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain>=0.3",
    "langchain-core",
    "langchain-anthropic",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "pexpect",
    "tenacity",
    "rich",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-PyYAML", "types-pexpect"]
docker-sdk = ["docker"]
# extra model providers (install on demand):
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
ollama = ["langchain-ollama"]
tsecbench = ["tsec-benchmark"]

[project.scripts]
midnight = "midnight.app:main"
midnight-stage = "midnight.evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midnight"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "midnight/_assets/config"
"docker" = "midnight/_assets/docker"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/test_ask_expert.py" = ["PLW1510"]
"tests/test_gdb_iat.py" = ["ASYNC221", "PLW1510"]
"tests/test_interactive.py" = ["PLW1510"]
"tests/test_retry.py" = ["PLW1510"]
